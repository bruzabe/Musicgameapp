<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatGuess 🎵</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;}
.screen{display:none;min-height:100vh;padding:1.5rem;flex-direction:column;align-items:center;justify-content:center;}
.screen.active{display:flex;}
h1{font-size:3rem;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#1DB954,#1ed760);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{color:#888;letter-spacing:3px;font-size:0.8rem;margin-bottom:1.5rem;}
.card{background:rgba(255,255,255,0.06);border-radius:16px;padding:1.2rem;width:100%;max-width:420px;margin-bottom:1rem;}
.label{font-size:0.72rem;font-weight:800;letter-spacing:2px;color:#888;margin-bottom:0.7rem;display:block;}
.row{display:flex;gap:0.6rem;flex-wrap:wrap;}
.sel-btn{flex:1;min-width:60px;padding:0.7rem;border-radius:10px;border:2px solid rgba(255,255,255,0.15);background:transparent;color:#fff;font-weight:800;font-size:0.95rem;cursor:pointer;transition:all 0.2s;}
.sel-btn.active{background:#1DB954;border-color:#1DB954;color:#000;}
.genre-btn{padding:0.5rem 1rem;border-radius:50px;border:2px solid rgba(255,255,255,0.15);background:transparent;color:#a8a8b3;font-size:0.85rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.genre-btn.active{border-color:#1DB954;color:#1DB954;background:rgba(29,185,84,0.1);}
.team-row{display:flex;align-items:center;background:rgba(255,255,255,0.05);border-radius:10px;margin-bottom:0.5rem;overflow:hidden;}
.dot{width:12px;height:12px;border-radius:50%;margin:0 0.8rem;flex-shrink:0;}
input[type=text]{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:0.95rem;font-weight:700;padding:0.75rem 0.5rem;font-family:inherit;}
input::placeholder{color:#444;}
.big-btn{width:100%;max-width:420px;padding:1rem;border-radius:14px;border:none;background:#1DB954;color:#000;font-weight:900;font-size:1.1rem;cursor:pointer;letter-spacing:2px;margin-top:0.5rem;}
.spotify-login{width:100%;max-width:420px;padding:1.2rem;border-radius:14px;border:none;background:#1DB954;color:#000;font-weight:900;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.8rem;margin-bottom:1rem;}
.pass-btn{padding:1rem 3rem;border-radius:50px;border:none;background:rgba(0,0,0,0.2);color:#fff;font-weight:900;font-size:1.1rem;cursor:pointer;}
.back-btn{position:fixed;top:1rem;left:1rem;padding:0.5rem 1rem;border-radius:50px;border:none;background:rgba(255,255,255,0.1);color:#fff;font-size:0.85rem;font-weight:700;cursor:pointer;z-index:100;}
.q-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0.9rem 1.2rem;}
.q-body{flex:1;padding:1rem;width:100%;max-width:430px;display:flex;flex-direction:column;gap:0.8rem;overflow-y:auto;}
.player{background:linear-gradient(135deg,#1a1a2e,#0d1b2a);border-radius:16px;overflow:hidden;border:1px solid rgba(29,185,84,0.3);}
.player-top{padding:1.2rem;text-align:center;}
.disc{font-size:3rem;display:inline-block;}
.disc.spin{animation:spin 3s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.prog-wrap{height:4px;background:rgba(255,255,255,0.08);margin:0 1rem;border-radius:2px;overflow:hidden;}
.prog-bar{height:100%;width:0%;background:#1DB954;border-radius:2px;transition:width 0.3s;}
.player-ctrl{display:flex;align-items:center;gap:0.8rem;padding:0.9rem 1rem;}
.play-btn{width:46px;height:46px;border-radius:50%;border:none;background:#1DB954;color:#000;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;}
.play-btn:disabled{background:rgba(255,255,255,0.1);color:#555;cursor:not-allowed;}
.play-status{color:#aaa;font-size:0.82rem;}
.opt{display:flex;align-items:center;gap:0.8rem;padding:0.85rem 1rem;border-radius:12px;border:2px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#fff;font-weight:700;cursor:pointer;text-align:left;width:100%;font-size:0.95rem;font-family:inherit;transition:all 0.2s;}
.opt.correct{background:#1a4a1a;border-color:#4ade80;color:#4ade80;}
.opt.wrong{background:#4a1a1a;border-color:#f87171;color:#f87171;}
.opt.dim{opacity:0.3;}
.opt-l{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:800;flex-shrink:0;}
.result{border-radius:16px;padding:1.1rem;text-align:center;}
.result.win{background:linear-gradient(135deg,#1a4a1a,#163316);border:1px solid #4ade80;}
.result.lose{background:linear-gradient(135deg,#4a1a1a,#331616);border:1px solid #f87171;}
.next-btn{margin-top:0.8rem;padding:0.7rem 2rem;border-radius:50px;border:none;background:#1DB954;color:#000;font-weight:900;cursor:pointer;font-size:1rem;font-family:inherit;}
.score-row{display:flex;align-items:center;gap:0.8rem;background:rgba(255,255,255,0.05);border-radius:12px;padding:0.9rem 1rem;margin-bottom:0.6rem;border-left:5px solid;}
.bar-wrap{flex:2;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.token-badge{background:rgba(29,185,84,0.15);border:1px solid #1DB954;border-radius:8px;padding:0.5rem 1rem;color:#1DB954;font-size:0.8rem;font-weight:700;margin-bottom:1rem;}
.loading{text-align:center;padding:2rem;color:#888;}
.spinner{font-size:2rem;animation:spin 1s linear infinite;display:inline-block;}
</style>
</head>
<body>

<div id="loginScreen" class="screen active" style="text-align:center">
  <div style="font-size:4rem;margin-bottom:1rem">🎵</div>
  <h1>BEATGUESS</h1>
  <div class="sub">TRIVIA MUSICAL</div>
  <div class="card" style="text-align:center;max-width:420px">
    <div style="color:#aaa;font-size:0.9rem;margin-bottom:1rem">Conectá tu Spotify Premium para escuchar las canciones</div>
    <button class="spotify-login" onclick="loginSpotify()">
      <span style="font-size:1.5rem">🎧</span> Conectar con Spotify
    </button>
    <div style="color:#555;font-size:0.75rem">Requiere Spotify Premium</div>
  </div>
</div>

<div id="setupScreen" class="screen">
  <div style="text-align:center;margin-bottom:1rem">
    <div style="font-size:2.5rem">🎵</div>
    <h1>BEATGUESS</h1>
    <div class="token-badge">✓ Spotify conectado</div>
  </div>

  <div class="card" style="max-width:420px">
    <span class="label">🎸 GÉNEROS</span>
    <div class="row" id="genreButtons"></div>
  </div>

  <div class="card" style="max-width:420px">
    <span class="label">🏆 PUNTOS PARA GANAR</span>
    <div class="row" id="pointButtons"></div>
  </div>

  <div class="card" style="max-width:420px">
    <span class="label">👥 EQUIPOS</span>
    <div class="row" style="margin-bottom:0.8rem">
      <button class="sel-btn active" onclick="setN(2)">2</button>
      <button class="sel-btn" onclick="setN(3)">3</button>
      <button class="sel-btn" onclick="setN(4)">4</button>
    </div>
    <div id="nameInputs"></div>
  </div>

  <button class="big-btn" onclick="startGame()">¡COMENZAR!</button>
</div>

<div id="passScreen" class="screen">
  <div style="font-size:4rem;margin-bottom:1rem">📱</div>
  <div id="passName" style="font-size:2.5rem;font-weight:900;letter-spacing:4px;color:rgba(0,0,0,0.8)"></div>
  <div style="color:rgba(0,0,0,0.6);font-weight:600;margin:0.5rem 0 2rem">Pasá el teléfono</div>
  <button class="pass-btn" onclick="loadQuestion()">¡LISTOS!</button>
  <button onclick="goHome()" style="margin-top:1rem;padding:0.5rem 1.5rem;border-radius:50px;border:none;background:rgba(0,0,0,0.15);color:rgba(0,0,0,0.5);cursor:pointer;font-family:inherit;">← Menú</button>
</div>

<div id="qScreen" class="screen" style="justify-content:flex-start;padding:0">
  <button class="back-btn" onclick="goHome()">← Menú</button>
  <div class="q-header" id="qHeader">
    <span id="qTeamName" style="font-weight:900;font-size:1.2rem;color:rgba(0,0,0,0.8)"></span>
    <span id="qPts" style="background:rgba(0,0,0,0.2);color:rgba(0,0,0,0.7);padding:0.3rem 0.8rem;border-radius:50px;font-weight:800"></span>
  </div>
  <div class="q-body">
    <div id="genreTag" style="font-size:0.72rem;font-weight:800;letter-spacing:2px;color:#888;"></div>
    <div class="player">
      <div class="player-top">
        <div class="disc" id="disc">🎵</div>
        <div id="songReveal" style="font-weight:700;color:#888;margin-top:0.4rem;font-size:0.95rem;">¿Qué canción es?</div>
      </div>
      <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
      <div class="player-ctrl">
        <button class="play-btn" id="playBtn" onclick="togglePlay()" disabled>⏳</button>
        <span class="play-status" id="playStatus">Conectando...</span>
      </div>
    </div>
    <div style="background:rgba(255,255,255,0.05);border-radius:14px;padding:0.9rem 1rem;border:1px solid rgba(255,255,255,0.08)">
      <div id="songTitle" style="font-weight:900;color:#888">Escuchá y adiviná...</div>
      <div style="color:#666;font-size:0.82rem;margin-top:0.2rem">¿Cuál es esta canción?</div>
    </div>
    <div id="optionsDiv"></div>
    <div id="resultDiv"></div>
  </div>
</div>

<div id="scoresMid" class="screen" style="justify-content:flex-start;padding-top:2rem">
  <button class="back-btn" onclick="goHome()">← Menú</button>
  <div style="font-size:2rem;font-weight:900;letter-spacing:4px;margin-bottom:1rem;margin-top:2rem">MARCADOR</div>
  <div id="scoresList" style="width:100%;max-width:400px"></div>
  <button class="big-btn" id="nextTurnBtn" onclick="nextTurn()"></button>
</div>

<div id="endScreen" class="screen" style="text-align:center">
  <div style="font-size:2.5rem;margin-bottom:0.5rem">🎆🎇✨</div>
  <div style="font-size:2rem;font-weight:900;letter-spacing:4px">¡FIN!</div>
  <div id="winnerText" style="color:#1DB954;font-weight:800;margin:0.5rem 0 1.5rem"></div>
  <div id="finalScores" style="width:100%;max-width:400px"></div>
  <button class="big-btn" onclick="goHome()">NUEVO JUEGO</button>
</div>

<script>
const CLIENT_ID = "2e2965c7459f4bc19f041cf2bb6095c6";
const REDIRECT_URI = "https://inquisitive-semolina-2138f1.netlify.app/callback";
const SCOPES = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";
const COLORS = ["#FF6B6B","#4ECDC4","#F7B731","#A29BFE"];
const RANKS = ["🥇","🥈","🥉","4️⃣"];

const GENRES = [
  { id:"80s", label:"80s", query:"year:1980-1989" },
  { id:"90s", label:"90s", query:"year:1990-1999" },
  { id:"2000s", label:"2000s", query:"year:2000-2009" },
  { id:"pop", label:"Pop", query:"genre:pop year:2010-2024" },
  { id:"rock", label:"Rock", query:"genre:rock" },
  { id:"latino", label:"Latino", query:"genre:latin" },
  { id:"reggaeton", label:"Reggaeton", query:"genre:reggaeton" },
  { id:"jazz", label:"Jazz", query:"genre:jazz" },
  { id:"classical", label:"Clásica", query:"genre:classical" },
  { id:"hiphop", label:"Hip-Hop", query:"genre:hip-hop" },
  { id:"electronic", label:"Electrónica", query:"genre:electronic" },
];

const POINT_OPTIONS = [50, 100, 150, 200];

let token=null, player=null, deviceId=null;
let nTeams=2, teams=[], idx=0, curQ=null, answered=false, isPlaying=false;
let maxPts=100, selectedGenres=["80s","90s","pop","rock"], usedTracks=[];

// ── Init ──────────────────────────────────────────────────────────────────────
function loginSpotify(){
  const url=`https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}&show_dialog=true`;
  window.location.href=url;
}

function initSpotifyPlayer(accessToken){
  window.onSpotifyWebPlaybackSDKReady=()=>{
    player=new Spotify.Player({
      name:"BeatGuess",
      getOAuthToken:cb=>cb(accessToken),
      volume:0.8
    });
    player.addListener("ready",({device_id})=>{
      deviceId=device_id;
      document.getElementById("playBtn").disabled=false;
      document.getElementById("playBtn").textContent="▶";
      document.getElementById("playStatus").textContent="Presioná play para escuchar";
    });
    player.addListener("player_state_changed",state=>{
      if(!state)return;
      if(state.duration) document.getElementById("progBar").style.width=(state.position/state.duration*100)+"%";
    });
    player.connect();
  };
  const s=document.createElement("script");
  s.src="https://sdk.scdn.co/spotify-player.js";
  document.head.appendChild(s);
}

window.onload=()=>{
  const params=new URLSearchParams(window.location.search);
  const t=params.get("token");
  if(t){
    token=t;
    window.history.replaceState({},"","/");
    initSpotifyPlayer(t);
    show("setupScreen");
    renderSetup();
  } else {
    show("loginScreen");
  }
};

// ── Setup UI ──────────────────────────────────────────────────────────────────
function renderSetup(){
  // Géneros
  const gb=document.getElementById("genreButtons");
  gb.innerHTML="";
  GENRES.forEach(g=>{
    const b=document.createElement("button");
    b.className="genre-btn"+(selectedGenres.includes(g.id)?" active":"");
    b.textContent=g.label;
    b.onclick=()=>{
      if(selectedGenres.includes(g.id)){
        if(selectedGenres.length>1) selectedGenres=selectedGenres.filter(x=>x!==g.id);
      } else {
        selectedGenres=[...selectedGenres,g.id];
      }
      b.classList.toggle("active",selectedGenres.includes(g.id));
    };
    gb.appendChild(b);
  });

  // Puntos
  const pb=document.getElementById("pointButtons");
  pb.innerHTML="";
  POINT_OPTIONS.forEach(p=>{
    const b=document.createElement("button");
    b.className="sel-btn"+(maxPts===p?" active":"");
    b.textContent=p+" pts";
    b.onclick=()=>{
      maxPts=p;
      document.querySelectorAll("#pointButtons .sel-btn").forEach(x=>x.classList.remove("active"));
      b.classList.add("active");
    };
    pb.appendChild(b);
  });

  renderInputs();
}

function setN(n){
  nTeams=n;
  document.querySelectorAll("#setupScreen .sel-btn").forEach((b,i)=>{
    if([2,3,4].includes(parseInt(b.textContent))) b.classList.toggle("active",parseInt(b.textContent)===n);
  });
  renderInputs();
}

function renderInputs(){
  const div=document.getElementById("nameInputs");
  div.innerHTML="";
  for(let i=0;i<nTeams;i++){
    div.innerHTML+=`<div class="team-row" style="border-left:4px solid ${COLORS[i]}"><div class="dot" style="background:${COLORS[i]}"></div><input type="text" placeholder="Equipo ${i+1}" id="name${i}" value="Equipo ${i+1}"></div>`;
  }
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");}

function goHome(){
  if(player) player.pause();
  isPlaying=false;
  usedTracks=[];
  show("setupScreen");
  renderSetup();
}

function startGame(){
  teams=[];
  for(let i=0;i<nTeams;i++){
    const name=document.getElementById("name"+i)?.value.trim()||`Equipo ${i+1}`;
    teams.push({name,pts:0,color:COLORS[i]});
  }
  idx=0;usedTracks=[];
  showPass();
}

function showPass(){
  if(isPlaying){player&&player.pause();isPlaying=false;}
  const t=teams[idx];
  document.getElementById("passScreen").style.background=t.color;
  document.getElementById("passName").textContent=t.name;
  show("passScreen");
}

// ── Buscar canción aleatoria en Spotify ───────────────────────────────────────
async function fetchRandomTrack(){
  const genre=GENRES.find(g=>g.id===selectedGenres[Math.floor(Math.random()*selectedGenres.length)]);
  const offset=Math.floor(Math.random()*500);
  const url=`https://api.spotify.com/v1/search?q=${encodeURIComponent(genre.query)}&type=track&limit=10&offset=${offset}&market=AR`;
  const res=await fetch(url,{headers:{"Authorization":"Bearer "+token}});
  const data=await res.json();
  const tracks=(data.tracks?.items||[]).filter(t=>t.preview_url||true).filter(t=>!usedTracks.includes(t.id));
  if(!tracks.length) return null;
  const track=tracks[Math.floor(Math.random()*tracks.length)];
  usedTracks.push(track.id);
  return {
    name:track.name,
    artist:track.artists.map(a=>a.name).join(", "),
    uri:track.uri,
    id:track.id,
    genre:genre.label
  };
}

async function fetchDecoys(correctName, correctArtist, genre){
  const offset=Math.floor(Math.random()*200);
  const g=GENRES.find(x=>x.label===genre)||GENRES[0];
  const url=`https://api.spotify.com/v1/search?q=${encodeURIComponent(g.query)}&type=track&limit=20&offset=${offset}&market=AR`;
  const res=await fetch(url,{headers:{"Authorization":"Bearer "+token}});
  const data=await res.json();
  const decoys=(data.tracks?.items||[])
    .filter(t=>t.name!==correctName)
    .map(t=>t.name);
  return [...new Set(decoys)].slice(0,3);
}

async function loadQuestion(){
  document.getElementById("optionsDiv").innerHTML=`<div class="loading"><div class="spinner">🎵</div><br>Buscando canción...</div>`;
  document.getElementById("resultDiv").innerHTML="";
  document.getElementById("progBar").style.width="0%";
  document.getElementById("disc").classList.remove("spin");
  document.getElementById("songReveal").textContent="¿Qué canción es?";
  document.getElementById("songReveal").style.color="#888";
  document.getElementById("songTitle").textContent="Escuchá y adiviná...";
  document.getElementById("songTitle").style.color="#888";
  answered=false;isPlaying=false;

  show("qScreen");

  const track=await fetchRandomTrack();
  if(!track){
    document.getElementById("optionsDiv").innerHTML=`<div style="color:#f87171;text-align:center">No se encontraron canciones. Cambiá los géneros.</div>`;
    return;
  }
  curQ=track;

  const decoys=await fetchDecoys(track.name, track.artist, track.genre);
  while(decoys.length<3) decoys.push("Canción desconocida "+decoys.length);
  const options=shuffle([track.name,...decoys.slice(0,3)]);

  const t=teams[idx];
  document.getElementById("qHeader").style.background=t.color;
  document.getElementById("qTeamName").textContent=t.name;
  document.getElementById("qPts").textContent=t.pts+" / "+maxPts+" pts";
  document.getElementById("genreTag").textContent=track.genre+" · "+track.artist;
  document.getElementById("playBtn").disabled=false;
  document.getElementById("playBtn").textContent="▶";
  document.getElementById("playStatus").textContent="Presioná play para escuchar";

  const od=document.getElementById("optionsDiv");
  od.innerHTML="";
  options.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML=`<span class="opt-l">${String.fromCharCode(65+i)}</span>${opt}`;
    b.onclick=()=>answer(opt,options);
    od.appendChild(b);
  });
}

// ── Playback ──────────────────────────────────────────────────────────────────
async function playTrack(uri){
  if(!player||!deviceId||!token)return;
  await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`,{
    method:"PUT",
    headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},
    body:JSON.stringify({uris:[uri],position_ms:0})
  });
}

function togglePlay(){
  if(!curQ)return;
  if(isPlaying){
    if(player)player.pause();
    isPlaying=false;
    document.getElementById("playBtn").textContent="▶";
    document.getElementById("playStatus").textContent="Pausado";
    document.getElementById("disc").classList.remove("spin");
  } else {
    player.activateElement().then(()=>{
      playTrack(curQ.uri);
      isPlaying=true;
      document.getElementById("playBtn").textContent="⏸";
      document.getElementById("playStatus").textContent="Reproduciendo 🎵";
      document.getElementById("disc").classList.add("spin");
    }).catch(()=>{
      playTrack(curQ.uri);
      isPlaying=true;
      document.getElementById("playBtn").textContent="⏸";
      document.getElementById("playStatus").textContent="Reproduciendo 🎵";
      document.getElementById("disc").classList.add("spin");
    });
  }
}

// ── Answer ────────────────────────────────────────────────────────────────────
function answer(opt, options){
  if(answered)return;
  answered=true;isPlaying=false;
  if(player)player.pause();
  document.getElementById("disc").classList.remove("spin");
  const win=opt===curQ.name;
  document.getElementById("songReveal").textContent=curQ.name+" — "+curQ.artist;
  document.getElementById("songReveal").style.color="#fff";
  document.getElementById("songTitle").textContent=curQ.name;
  document.getElementById("songTitle").style.color="#fff";
  document.querySelectorAll("#optionsDiv .opt").forEach(b=>{
    const txt=b.textContent.trim().slice(1).trim();
    if(txt===curQ.name)b.classList.add("correct");
    else if(txt===opt)b.classList.add("wrong");
    else b.classList.add("dim");
    b.disabled=true;
  });
  document.getElementById("resultDiv").innerHTML=`<div class="result ${win?"win":"lose"}">
    <div style="font-size:1.8rem">${win?"🎉":"😅"}</div>
    <div style="font-weight:800;color:${win?"#4ade80":"#f87171"};margin-top:0.3rem">${win?"+10 puntos para "+teams[idx].name+"!":"Era: "+curQ.name}</div>
    <button class="next-btn" onclick="nextQuestion()">Siguiente →</button>
  </div>`;
}

function nextQuestion(){
  const win=document.querySelector("#resultDiv .result")?.classList.contains("win");
  teams=teams.map((t,i)=>i===idx?{...t,pts:Math.min(maxPts,t.pts+(win?10:0))}:t);
  if(teams.some(t=>t.pts>=maxPts)){showEnd();return;}
  idx=(idx+1)%teams.length;
  showScoresMid();
}

function showScoresMid(){
  const sorted=[...teams].sort((a,b)=>b.pts-a.pts);
  document.getElementById("scoresList").innerHTML=sorted.map((t,i)=>`
    <div class="score-row" style="border-left-color:${t.color}">
      <span>${RANKS[i]}</span><span style="flex:1;font-weight:800">${t.name}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${(t.pts/maxPts)*100}%;background:${t.color}"></div></div>
      <span style="font-weight:900;min-width:55px;text-align:right">${t.pts}/${maxPts}</span>
    </div>`).join("");
  document.getElementById("nextTurnBtn").textContent="Turno de "+teams[idx].name+" →";
  show("scoresMid");
}

function nextTurn(){showPass();}

function showEnd(){
  if(player)player.pause();
  const sorted=[...teams].sort((a,b)=>b.pts-a.pts);
  document.getElementById("winnerText").textContent="🏆 Ganador: "+sorted[0].name;
  document.getElementById("finalScores").innerHTML=sorted.map((t,i)=>`
    <div class="score-row" style="border-left-color:${t.color}">
      <span>${RANKS[i]}</span><span style="flex:1;font-weight:800">${t.name}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${(t.pts/maxPts)*100}%;background:${t.color}"></div></div>
      <span style="font-weight:900;min-width:55px;text-align:right">${t.pts}/${maxPts}</span>
    </div>`).join("");
  show("endScreen");
}
</script>
</body>
</html>
