<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BeatGuess 🎵</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#0f0e17;color:#fff;min-height:100vh;}
.screen{display:none;min-height:100vh;padding:1.5rem;flex-direction:column;align-items:center;justify-content:center;}
.screen.active{display:flex;}
h1{font-size:3rem;font-weight:900;letter-spacing:6px;background:linear-gradient(90deg,#1DB954,#1ed760);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.sub{color:#888;letter-spacing:3px;font-size:0.8rem;margin-bottom:2rem;}
.card{background:rgba(255,255,255,0.06);border-radius:16px;padding:1.2rem;width:100%;max-width:400px;margin-bottom:1rem;}
.label{font-size:0.72rem;font-weight:800;letter-spacing:2px;color:#888;margin-bottom:0.7rem;display:block;}
.row{display:flex;gap:0.6rem;}
.cnt-btn{flex:1;padding:0.8rem;border-radius:10px;border:2px solid rgba(255,255,255,0.15);background:transparent;color:#fff;font-weight:800;font-size:1.1rem;cursor:pointer;}
.cnt-btn.sel{background:#1DB954;border-color:#1DB954;}
.team-row{display:flex;align-items:center;background:rgba(255,255,255,0.05);border-radius:10px;margin-bottom:0.5rem;overflow:hidden;}
.dot{width:12px;height:12px;border-radius:50%;margin:0 0.8rem;flex-shrink:0;}
input{flex:1;background:transparent;border:none;outline:none;color:#fff;font-size:0.95rem;font-weight:700;padding:0.75rem 0.5rem;font-family:inherit;}
input::placeholder{color:#444;}
.big-btn{width:100%;max-width:400px;padding:1rem;border-radius:14px;border:none;background:#1DB954;color:#000;font-weight:900;font-size:1.1rem;cursor:pointer;letter-spacing:2px;margin-top:0.5rem;}
.spotify-login{width:100%;max-width:400px;padding:1.2rem;border-radius:14px;border:none;background:#1DB954;color:#000;font-weight:900;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.8rem;margin-bottom:1rem;}
.pass-btn{padding:1rem 3rem;border-radius:50px;border:none;background:rgba(0,0,0,0.2);color:#fff;font-weight:900;font-size:1.1rem;cursor:pointer;}
.q-header{width:100%;display:flex;justify-content:space-between;align-items:center;padding:0.9rem 1.2rem;}
.q-body{flex:1;padding:1rem;width:100%;max-width:430px;display:flex;flex-direction:column;gap:0.8rem;overflow-y:auto;}
.player{background:linear-gradient(135deg,#1a1a2e,#0d1b2a);border-radius:16px;overflow:hidden;border:1px solid rgba(29,185,84,0.3);}
.player-top{padding:1.2rem;text-align:center;}
.disc{font-size:3rem;display:inline-block;}
.disc.spin{animation:spin 3s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.prog-wrap{height:4px;background:rgba(255,255,255,0.08);margin:0 1rem;border-radius:2px;overflow:hidden;}
.prog-bar{height:100%;width:0%;background:#1DB954;border-radius:2px;transition:width 0.3s;}
.player-ctrl{display:flex;align-items:center;gap:0.8rem;padding:0.9rem 1rem;}
.play-btn{width:46px;height:46px;border-radius:50%;border:none;background:#1DB954;color:#000;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;}
.play-btn:disabled{background:rgba(255,255,255,0.1);color:#555;cursor:not-allowed;}
.play-status{color:#aaa;font-size:0.82rem;}
.opt{display:flex;align-items:center;gap:0.8rem;padding:0.85rem 1rem;border-radius:12px;border:2px solid rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);color:#fff;font-weight:700;cursor:pointer;text-align:left;width:100%;font-size:0.95rem;font-family:inherit;}
.opt.correct{background:#1a4a1a;border-color:#4ade80;color:#4ade80;}
.opt.wrong{background:#4a1a1a;border-color:#f87171;color:#f87171;}
.opt.dim{opacity:0.3;}
.opt-l{width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:800;flex-shrink:0;}
.result{border-radius:16px;padding:1.1rem;text-align:center;}
.result.win{background:linear-gradient(135deg,#1a4a1a,#163316);border:1px solid #4ade80;}
.result.lose{background:linear-gradient(135deg,#4a1a1a,#331616);border:1px solid #f87171;}
.next-btn{margin-top:0.8rem;padding:0.7rem 2rem;border-radius:50px;border:none;background:#1DB954;color:#000;font-weight:900;cursor:pointer;font-size:1rem;font-family:inherit;}
.score-row{display:flex;align-items:center;gap:0.8rem;background:rgba(255,255,255,0.05);border-radius:12px;padding:0.9rem 1rem;margin-bottom:0.6rem;border-left:5px solid;}
.bar-wrap{flex:2;height:8px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;}
.token-badge{background:rgba(29,185,84,0.15);border:1px solid #1DB954;border-radius:8px;padding:0.5rem 1rem;color:#1DB954;font-size:0.8rem;font-weight:700;margin-bottom:1rem;}
</style>
</head>
<body>

<div id="loginScreen" class="screen active" style="text-align:center">
  <div style="font-size:4rem;margin-bottom:1rem">🎵</div>
  <h1>BEATGUESS</h1>
  <div class="sub">TRIVIA MUSICAL</div>
  <div class="card" style="text-align:center;max-width:400px">
    <div style="color:#aaa;font-size:0.9rem;margin-bottom:1rem">Conectá tu Spotify para escuchar las canciones</div>
    <button class="spotify-login" onclick="loginSpotify()">
      <span style="font-size:1.5rem">🎧</span> Conectar con Spotify
    </button>
    <div style="color:#555;font-size:0.75rem">Requiere Spotify Premium</div>
  </div>
</div>

<div id="setupScreen" class="screen">
  <div style="text-align:center;margin-bottom:1.5rem">
    <div style="font-size:3rem">🎵</div>
    <h1>BEATGUESS</h1>
    <div class="sub">TRIVIA MUSICAL</div>
    <div class="token-badge">✓ Spotify conectado</div>
  </div>
  <div class="card" style="max-width:400px">
    <span class="label">¿CUÁNTOS EQUIPOS?</span>
    <div class="row">
      <button class="cnt-btn sel" onclick="setN(2)">2</button>
      <button class="cnt-btn" onclick="setN(3)">3</button>
      <button class="cnt-btn" onclick="setN(4)">4</button>
    </div>
  </div>
  <div class="card" style="max-width:400px">
    <span class="label">NOMBRES</span>
    <div id="nameInputs"></div>
  </div>
  <button class="big-btn" onclick="startGame()">¡COMENZAR!</button>
</div>

<div id="passScreen" class="screen">
  <div style="font-size:4rem;margin-bottom:1rem">📱</div>
  <div id="passName" style="font-size:2.5rem;font-weight:900;letter-spacing:4px;color:rgba(0,0,0,0.8)"></div>
  <div style="color:rgba(0,0,0,0.6);font-weight:600;margin:0.5rem 0 2rem">Pasá el teléfono</div>
  <button class="pass-btn" onclick="loadQuestion()">¡LISTOS!</button>
</div>

<div id="qScreen" class="screen" style="justify-content:flex-start;padding:0">
  <div class="q-header" id="qHeader">
    <span id="qTeamName" style="font-weight:900;font-size:1.2rem;color:rgba(0,0,0,0.8)"></span>
    <span id="qPts" style="background:rgba(0,0,0,0.2);color:rgba(0,0,0,0.7);padding:0.3rem 0.8rem;border-radius:50px;font-weight:800"></span>
  </div>
  <div class="q-body">
    <div id="genreTag" style="font-size:0.72rem;font-weight:800;letter-spacing:2px;color:#888;"></div>
    <div class="player">
      <div class="player-top">
        <div class="disc" id="disc">🎵</div>
        <div id="songReveal" style="font-weight:700;color:#888;margin-top:0.4rem;font-size:0.95rem;">¿Qué canción es?</div>
      </div>
      <div class="prog-wrap"><div class="prog-bar" id="progBar"></div></div>
      <div class="player-ctrl">
        <button class="play-btn" id="playBtn" onclick="togglePlay()" disabled>⏳</button>
        <span class="play-status" id="playStatus">Conectando...</span>
      </div>
    </div>
    <div style="background:rgba(255,255,255,0.05);border-radius:14px;padding:0.9rem 1rem;border:1px solid rgba(255,255,255,0.08)">
      <div id="songTitle" style="font-weight:900;color:#888">Escuchá y adiviná...</div>
      <div style="color:#666;font-size:0.82rem;margin-top:0.2rem">¿Cuál es esta canción?</div>
    </div>
    <div id="optionsDiv"></div>
    <div id="resultDiv"></div>
  </div>
</div>

<div id="scoresMid" class="screen" style="justify-content:flex-start;padding-top:2rem">
  <div style="font-size:2rem;font-weight:900;letter-spacing:4px;margin-bottom:1rem">MARCADOR</div>
  <div id="scoresList" style="width:100%;max-width:400px"></div>
  <button class="big-btn" id="nextTurnBtn" onclick="nextTurn()"></button>
</div>

<div id="endScreen" class="screen" style="text-align:center">
  <div style="font-size:2.5rem;margin-bottom:0.5rem">🎆🎇✨</div>
  <div style="font-size:2rem;font-weight:900;letter-spacing:4px">¡FIN!</div>
  <div id="winnerText" style="color:#1DB954;font-weight:800;margin:0.5rem 0 1.5rem"></div>
  <div id="finalScores" style="width:100%;max-width:400px"></div>
  <button class="big-btn" onclick="location.reload()">NUEVO JUEGO</button>
</div>

<script>
const CLIENT_ID = "2e2965c7459f4bc19f041cf2bb6095c6";
const REDIRECT_URI = "https://inquisitive-semolina-2138f1.netlify.app/callback";

const SCOPES = "streaming user-read-email user-read-private user-modify-playback-state user-read-playback-state";
const COLORS = ["#FF6B6B","#4ECDC4","#F7B731","#A29BFE"];
const RANKS = ["🥇","🥈","🥉","4️⃣"];

// Las opciones son NOMBRES DE CANCIONES, no artistas
const QS = [
  { s:"Take On Me", a:"Take On Me", o:["Take On Me","Don't You Forget About Me","Girls Just Want to Have Fun","With or Without You"], y:1985, uri:"spotify:track:2WfaOiMkCvy2orKaqnZbd2", g:"80s", artist:"a-ha" },
  { s:"Sweet Child O' Mine", a:"Sweet Child O' Mine", o:["Sweet Child O' Mine","Livin' on a Prayer","Pour Some Sugar on Me","Here I Go Again"], y:1988, uri:"spotify:track:7o2CTH4ctstm8TNelqjb51", g:"80s", artist:"Guns N' Roses" },
  { s:"Eye of the Tiger", a:"Eye of the Tiger", o:["Eye of the Tiger","We Are the Champions","Eye of the Storm","Survivor"], y:1982, uri:"spotify:track:2HHtWyy5CgaQbC7XSoOb0e", g:"80s", artist:"Survivor" },
  { s:"Africa", a:"Africa", o:["Africa","Rosanna","I'll Be Over You","Pamela"], y:1982, uri:"spotify:track:2374M0fQpWi3dLnB54qaLX", g:"80s", artist:"Toto" },
  { s:"Like a Prayer", a:"Like a Prayer", o:["Like a Prayer","Material Girl","Papa Don't Preach","Vogue"], y:1989, uri:"spotify:track:1z3ugFmUKoCzGsI6jdY4Ci", g:"80s", artist:"Madonna" },
  { s:"Shape of You", a:"Shape of You", o:["Shape of You","Perfect","Thinking Out Loud","Photograph"], y:2017, uri:"spotify:track:7qiZfU4dY1lWllzX7mPBI3", g:"Pop", artist:"Ed Sheeran" },
  { s:"Blinding Lights", a:"Blinding Lights", o:["Blinding Lights","Starboy","Can't Feel My Face","Save Your Tears"], y:2019, uri:"spotify:track:0VjIjW4GlUZAMYd2vXMi3b", g:"Pop", artist:"The Weeknd" },
  { s:"Rolling in the Deep", a:"Rolling in the Deep", o:["Rolling in the Deep","Someone Like You","Hello","Skyfall"], y:2010, uri:"spotify:track:4kI8Ie27vjvonwaB2ePh8T", g:"Pop", artist:"Adele" },
  { s:"Bad Guy", a:"Bad Guy", o:["Bad Guy","Ocean Eyes","Lovely","Happier Than Ever"], y:2019, uri:"spotify:track:2Fxmhks0live3ACRDgk4Ns", g:"Pop", artist:"Billie Eilish" },
  { s:"Uptown Funk", a:"Uptown Funk", o:["Uptown Funk","Locked Out of Heaven","Just the Way You Are","Grenade"], y:2014, uri:"spotify:track:32OlwWuMpZ6b0aN2RZOeMS", g:"Pop", artist:"Mark Ronson ft. Bruno Mars" },
  { s:"Bohemian Rhapsody", a:"Bohemian Rhapsody", o:["Bohemian Rhapsody","We Will Rock You","Don't Stop Me Now","Somebody to Love"], y:1975, uri:"spotify:track:7tFiyTwD0nx5a1eklYtX2J", g:"Rock", artist:"Queen" },
  { s:"Smells Like Teen Spirit", a:"Smells Like Teen Spirit", o:["Smells Like Teen Spirit","Come as You Are","Heart-Shaped Box","Lithium"], y:1991, uri:"spotify:track:5ghIJDpPoe3CfHMGu71E6T", g:"Rock", artist:"Nirvana" },
  { s:"Hotel California", a:"Hotel California", o:["Hotel California","Life in the Fast Lane","Desperado","Take It Easy"], y:1977, uri:"spotify:track:40riOy7x9W7GXjyGp4pjAv", g:"Rock", artist:"Eagles" },
  { s:"Mr. Brightside", a:"Mr. Brightside", o:["Mr. Brightside","Somebody Told Me","All These Things That I've Done","Human"], y:2003, uri:"spotify:track:003vvx7Niy0yvhvHt4a68B", g:"Rock", artist:"The Killers" },
  { s:"Wonderwall", a:"Wonderwall", o:["Wonderwall","Don't Look Back in Anger","Champagne Supernova","Some Might Say"], y:1995, uri:"spotify:track:1sca7NVHqQDNdMhXNy6Gpa", g:"Rock", artist:"Oasis" },
  { s:"Despacito", a:"Despacito", o:["Despacito","Con Calma","Échame la Culpa","Si Tu Novio Te Deja Sola"], y:2017, uri:"spotify:track:6habFhsOp2NvshLv26DqMb", g:"Latino", artist:"Luis Fonsi ft. Daddy Yankee" },
  { s:"Livin' la Vida Loca", a:"Livin' la Vida Loca", o:["Livin' la Vida Loca","She Bangs","Shake Your Bon-Bon","María"], y:1999, uri:"spotify:track:5qqabIl2vWzo9ApSC317sa", g:"Latino", artist:"Ricky Martin" },
  { s:"Bailando", a:"Bailando", o:["Bailando","Hero","Rhythm Divine","Be With You"], y:2014, uri:"spotify:track:1n7ekKbsEBsRkMCvhHAjbS", g:"Latino", artist:"Enrique Iglesias" },
  { s:"...Baby One More Time", a:"...Baby One More Time", o:["...Baby One More Time","Oops!... I Did It Again","Toxic","Womanizer"], y:1998, uri:"spotify:track:3MjUtNVVq3C8Fn0MP3zhXa", g:"90s", artist:"Britney Spears" },
  { s:"Wannabe", a:"Wannabe", o:["Wannabe","Say You'll Be There","2 Become 1","Spice Up Your Life"], y:1996, uri:"spotify:track:1Je1IMUlBXfWbg5Tbo4qQR", g:"90s", artist:"Spice Girls" },
  { s:"Killing Me Softly", a:"Killing Me Softly", o:["Killing Me Softly","Ready or Not","No Woman No Cry","Fu-Gee-La"], y:1996, uri:"spotify:track:3MeChQWCbJMkKMDlPzRNvw", g:"90s", artist:"Fugees" },
  { s:"Crazy in Love", a:"Crazy in Love", o:["Crazy in Love","Halo","Single Ladies","Love on Top"], y:2003, uri:"spotify:track:5IVuqXILoxVWvWEPm82Jxr", g:"2000s", artist:"Beyoncé ft. Jay-Z" },
  { s:"In the End", a:"In the End", o:["In the End","Numb","Crawling","Faint"], y:2000, uri:"spotify:track:60a0Rd6pjrkxjPbaKzXjfq", g:"2000s", artist:"Linkin Park" },
  { s:"Toxic", a:"Toxic", o:["Toxic","Circus","If You Seek Amy","3"], y:2004, uri:"spotify:track:6I9VkIzoe5WKJE7Tku3Era", g:"2000s", artist:"Britney Spears" },
  { s:"Hey Ya!", a:"Hey Ya!", o:["Hey Ya!","The Way You Move","Ms. Jackson","Roses"], y:2003, uri:"spotify:track:2PpruBYCo4H7WOBJ7Q2EwM", g:"2000s", artist:"OutKast" },
  { s:"Shake It Off", a:"Shake It Off", o:["Shake It Off","Blank Space","Bad Blood","22"], y:2014, uri:"spotify:track:5DSXc3cQvElXPSmIoWqTaE", g:"Pop", artist:"Taylor Swift" },
  { s:"Happy", a:"Happy", o:["Happy","Get Lucky","Blurred Lines","Give Life Back to Music"], y:2013, uri:"spotify:track:60nZcImufyMA1MKQY3dcCH", g:"Pop", artist:"Pharrell Williams" },
];

let token = null, player = null, deviceId = null;
let nTeams=2, teams=[], idx=0, used=[], curQ=null, answered=false, isPlaying=false;

function loginSpotify() {
  const url = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=code&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}&show_dialog=true`;
  window.location.href = url;
}

function initSpotifyPlayer(accessToken) {
  window.onSpotifyWebPlaybackSDKReady = () => {
    player = new Spotify.Player({
      name: "BeatGuess",
      getOAuthToken: cb => cb(accessToken),
      volume: 0.8
    });
    player.addListener("ready", ({ device_id }) => {
      deviceId = device_id;
      document.getElementById("playBtn").disabled = false;
      document.getElementById("playBtn").textContent = "▶";
      document.getElementById("playStatus").textContent = "Presioná play para escuchar";
    });
    player.addListener("player_state_changed", state => {
      if (!state) return;
      if (state.duration) document.getElementById("progBar").style.width = (state.position/state.duration*100)+"%";
    });
    player.connect();
  };
  const s = document.createElement("script");
  s.src = "https://sdk.scdn.co/spotify-player.js";
  document.head.appendChild(s);
}

async function playTrack(uri) {
  if (!player || !deviceId || !token) return;
  // Transferir playback a BeatGuess y reproducir
  await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${deviceId}`, {
    method: "PUT",
    headers: { "Authorization": "Bearer "+token, "Content-Type": "application/json" },
    body: JSON.stringify({ uris: [uri], position_ms: 0 })
  });
}

async function pauseTrack() {
  if (!player) return;
  player.pause();
}

window.onload = () => {
  const params = new URLSearchParams(window.location.search);
  const t = params.get("token");
  if (t) {
    token = t;
    window.history.replaceState({}, "", "/");
    initSpotifyPlayer(t);
    show("setupScreen");
    renderInputs();
  } else {
    show("loginScreen");
  }
};

function setN(n) {
  nTeams=n;
  document.querySelectorAll(".cnt-btn").forEach((b,i)=>b.classList.toggle("sel",i===n-2));
  renderInputs();
}

function renderInputs() {
  const div=document.getElementById("nameInputs");
  div.innerHTML="";
  for(let i=0;i<nTeams;i++){
    div.innerHTML+=`<div class="team-row" style="border-left:4px solid ${COLORS[i]}"><div class="dot" style="background:${COLORS[i]}"></div><input placeholder="Equipo ${i+1}" id="name${i}" value="Equipo ${i+1}"></div>`;
  }
}

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));document.getElementById(id).classList.add("active");}

function startGame(){
  teams=[];
  for(let i=0;i<nTeams;i++){
    const name=document.getElementById("name"+i)?.value.trim()||`Equipo ${i+1}`;
    teams.push({name,pts:0,color:COLORS[i]});
  }
  idx=0;used=[];showPass();
}

function showPass(){
  if(isPlaying){pauseTrack();isPlaying=false;}
  const t=teams[idx];
  document.getElementById("passScreen").style.background=t.color;
  document.getElementById("passName").textContent=t.name;
  show("passScreen");
}

function loadQuestion(){
  const pool=QS.filter(q=>!used.includes(q.s));
  const item=pool.length?pool[Math.floor(Math.random()*pool.length)]:QS[Math.floor(Math.random()*QS.length)];
  curQ={...item,o:shuffle(item.o)};
  used.push(item.s);
  answered=false;isPlaying=false;

  const t=teams[idx];
  document.getElementById("qHeader").style.background=t.color;
  document.getElementById("qTeamName").textContent=t.name;
  document.getElementById("qPts").textContent=t.pts+" / 100 pts";
  document.getElementById("genreTag").textContent=curQ.g+" · "+curQ.y+" · "+curQ.artist;
  document.getElementById("songReveal").textContent="¿Qué canción es?";
  document.getElementById("songReveal").style.color="#888";
  document.getElementById("songTitle").textContent="Escuchá y adiviná...";
  document.getElementById("songTitle").style.color="#888";
  document.getElementById("resultDiv").innerHTML="";
  document.getElementById("progBar").style.width="0%";
  document.getElementById("disc").classList.remove("spin");
  document.getElementById("playBtn").textContent="▶";
  document.getElementById("playStatus").textContent="Presioná play para escuchar";

  const od=document.getElementById("optionsDiv");
  od.innerHTML="";
  curQ.o.forEach((opt,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.innerHTML=`<span class="opt-l">${String.fromCharCode(65+i)}</span>${opt}`;
    b.onclick=()=>answer(opt);
    od.appendChild(b);
  });

  show("qScreen");
}

function togglePlay(){
  if(!curQ)return;
  if(isPlaying){
    pauseTrack();isPlaying=false;
    document.getElementById("playBtn").textContent="▶";
    document.getElementById("playStatus").textContent="Pausado";
    document.getElementById("disc").classList.remove("spin");
  } else {
    playTrack(curQ.uri);isPlaying=true;
    document.getElementById("playBtn").textContent="⏸";
    document.getElementById("playStatus").textContent="Reproduciendo 🎵";
    document.getElementById("disc").classList.add("spin");
  }
}

function answer(opt){
  if(answered)return;
  answered=true;isPlaying=false;
  pauseTrack();
  document.getElementById("disc").classList.remove("spin");
  const win=opt===curQ.a;
  document.getElementById("songReveal").textContent=curQ.s+" — "+curQ.artist;
  document.getElementById("songReveal").style.color="#fff";
  document.getElementById("songTitle").textContent=curQ.s;
  document.getElementById("songTitle").style.color="#fff";
  document.querySelectorAll("#optionsDiv .opt").forEach(b=>{
    const txt=b.textContent.trim().slice(1).trim();
    if(txt===curQ.a)b.classList.add("correct");
    else if(txt===opt)b.classList.add("wrong");
    else b.classList.add("dim");
    b.disabled=true;
  });
  document.getElementById("resultDiv").innerHTML=`<div class="result ${win?"win":"lose"}">
    <div style="font-size:1.8rem">${win?"🎉":"😅"}</div>
    <div style="font-weight:800;color:${win?"#4ade80":"#f87171"};margin-top:0.3rem">${win?"+10 puntos para "+teams[idx].name+"!":"Era: "+curQ.s}</div>
    <button class="next-btn" onclick="nextQuestion()">Siguiente →</button>
  </div>`;
}

function nextQuestion(){
  const win=document.querySelector("#resultDiv .result")?.classList.contains("win");
  teams=teams.map((t,i)=>i===idx?{...t,pts:Math.min(100,t.pts+(win?10:0))}:t);
  if(teams.some(t=>t.pts>=100)){showEnd();return;}
  idx=(idx+1)%teams.length;
  showScoresMid();
}

function showScoresMid(){
  const sorted=[...teams].sort((a,b)=>b.pts-a.pts);
  document.getElementById("scoresList").innerHTML=sorted.map((t,i)=>`
    <div class="score-row" style="border-left-color:${t.color}">
      <span>${RANKS[i]}</span><span style="flex:1;font-weight:800">${t.name}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${t.pts}%;background:${t.color}"></div></div>
      <span style="font-weight:900;min-width:42px;text-align:right">${t.pts}</span>
    </div>`).join("");
  document.getElementById("nextTurnBtn").textContent="Turno de "+teams[idx].name+" →";
  show("scoresMid");
}

function nextTurn(){showPass();}

function showEnd(){
  if(isPlaying){pauseTrack();isPlaying=false;}
  const sorted=[...teams].sort((a,b)=>b.pts-a.pts);
  document.getElementById("winnerText").textContent="🏆 Ganador: "+sorted[0].name;
  document.getElementById("finalScores").innerHTML=sorted.map((t,i)=>`
    <div class="score-row" style="border-left-color:${t.color}">
      <span>${RANKS[i]}</span><span style="flex:1;font-weight:800">${t.name}</span>
      <div class="bar-wrap"><div class="bar-fill" style="width:${t.pts}%;background:${t.color}"></div></div>
      <span style="font-weight:900;min-width:42px;text-align:right">${t.pts}</span>
    </div>`).join("");
  show("endScreen");
}

renderInputs();
</script>
</body>
</html>
